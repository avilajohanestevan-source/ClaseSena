<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <!-- Pieza A del login, diseño "Manual SENA": solo paleta principal (verde #39A900 y blanco). -->
  <defs>
    <radialGradient id="b" cx=".28" cy=".2" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".14"/>
    </pattern>
  </defs>
  <rect width="900" height="360" rx="180" fill="#39A900"/>
  <rect width="900" height="360" rx="180" fill="url(#p)"/>
  <rect width="900" height="360" rx="180" fill="url(#b)"/>
  <rect x="28" y="28" width="844" height="304" rx="152" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
