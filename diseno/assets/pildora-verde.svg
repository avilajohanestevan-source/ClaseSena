<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <!-- Pieza A del fondo de login. Verde institucional #39A900 → #007832. -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DBB12"/><stop offset=".45" stop-color="#39A900"/><stop offset="1" stop-color="#007832"/>
    </linearGradient>
    <radialGradient id="b" cx=".28" cy=".2" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="900" height="360" rx="180" fill="url(#a)"/>
  <rect width="900" height="360" rx="180" fill="url(#p)"/>
  <rect width="900" height="360" rx="180" fill="url(#b)"/>
  <rect x="28" y="28" width="844" height="304" rx="152" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
